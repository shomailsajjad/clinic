<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Clinic document{% endblock %}</title><style>
body{font-family:Arial,sans-serif;color:#111;background:#eee;margin:0;font-size:13px;line-height:1.5}.document{background:white;max-width:800px;margin:25px auto;padding:35px}.controls{text-align:center;margin:20px}button,a{font:inherit;padding:9px 15px;color:#176b59}h1{font-size:21px;margin:0}h2{font-size:17px}p{margin:8px 0}.clinic-heading{text-align:center;border-bottom:2px solid #176b59;padding-bottom:15px;margin-bottom:20px}.muted{color:#666;font-size:11px}.row{display:flex;justify-content:space-between;gap:15px}.label{font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:8px 3px;text-align:left;border-bottom:1px solid #ddd}.text{white-space:pre-wrap;overflow-wrap:anywhere}.signature{margin-top:40px;text-align:right}.warning{border:1px solid #a94432;padding:8px;color:#a94432}.token{font-size:28px;font-weight:bold;text-align:center}.receipt{max-width:80mm;padding:7mm;font-size:11px}.receipt h1{font-size:15px}.receipt .clinic-heading{border-color:#111;margin-bottom:12px}.receipt table{font-size:10px}.receipt .token{font-size:20px}.no-split{break-inside:avoid}@media print{body{background:white}.controls{display:none}.document{margin:0;padding:0;max-width:none}.receipt{width:66mm;max-width:66mm;margin:auto}.document h2{break-after:avoid}.signature{break-inside:avoid}thead{display:table-header-group}}{% block print_css %}@page{size:A4;margin:15mm}{% endblock %}
</style></head><body><div class="controls"><button onclick="window.print()">Print</button> <a href="{% url 'booking_list' %}">Back to bookings</a></div><main class="document {% block document_class %}{% endblock %}"><header class="clinic-heading"><h1>{{ letterhead.name }}</h1><p>{{ letterhead.doctor_name }}</p><p class="muted">{{ letterhead.qualifications }}</p><p>{{ letterhead.address }} · {{ letterhead.phone }}</p></header>{% block document %}{% endblock %}</main></body></html>
